temporary_vulnerability_baseline:
  approved_on: "2026-11-25"
  expires_on: "2026-12-25"
  source_image: local/hass-portainer-ee:2.45.4.1
  source_binary: /portainer
  severity: HIGH
  finding_count: 9
  operating_conditions:
    private_network_only: true
    administrator_only: true
    trusted_git_sources_only: true
    trusted_images_only: true
  review_triggers:
    - Portainer publishes a newer server or agent image
    - Trivy reports a new HIGH or CRITICAL finding
    - Network exposure or user roles are expanded
    - The expiration date is reached

  reviewed_on: '2026-11-25'
accepted_risks:
  - id: AVD-DS-0002
    kind: misconfiguration
    component: portaineree/Dockerfile
    affected_version: "2.45.4.1"
    expires_when: Portainer supports rootless local Docker management
    rationale: Portainer requires root access to the Supervisor Docker socket
  - id: CVE-2025-15558
    kind: vulnerability
    severity: HIGH
    component: github.com/docker/cli
    affected_version: v28.5.1+incompatible
    purl: pkg:golang/github.com/docker/cli@v28.5.1%2Bincompatible
    expires_on: "2026-12-25"
    rationale: >-
      Only Windows is affected; the app image runs on Linux
  - id: CVE-2026-17106
    kind: vulnerability
    severity: HIGH
    component: github.com/moby/go-archive
    affected_version: v0.1.0
    purl: pkg:golang/github.com/moby/go-archive@v0.1.0
    expires_on: "2026-12-25"
    rationale: >-
      Only trusted images and archives during temporary private operation
  - id: CVE-2026-33747
