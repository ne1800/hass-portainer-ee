name: Bug report
description: Report a reproducible problem with the Home Assistant app
body:
  - type: markdown
    attributes:
      value: >-
        Report vulnerabilities privately through the Security tab.
        Do not include passwords, API or Edge keys, setup tokens, license data,
        private addresses, backups, or full configuration exports.
  - type: input
    id: version
    attributes:
      label: App and Portainer versions
      description: Use the installed app version and the Portainer version shown in its UI.
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include relevant Home Assistant OS and Supervisor versions and minimal steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal redacted evidence
      description: Include only the relevant error excerpt after removing sensitive values.
