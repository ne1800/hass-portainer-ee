minimum_prek_version: "0.4.14"

repos:
  - repo: local
    hooks:
      - id: secrets
        name: Scan current tree for secrets
        entry: mise run security:secrets
        language: system
        always_run: true
        pass_filenames: false
      - id: lint
        name: Lint repository
        entry: mise run lint
        language: system
        always_run: true
        pass_filenames: false
      - id: test
        name: Run deterministic tests
        entry: mise run test
        language: system
        always_run: true
        pass_filenames: false
