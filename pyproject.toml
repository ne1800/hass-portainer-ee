[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hass-portainer-ee-tools"
version = "0.1.0"
description = "Release and update tooling for the Home Assistant Portainer EE app"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ruamel-yaml>=0.18,<0.19",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hass_portainer_ee_tools"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
