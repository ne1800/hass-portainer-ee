vulnerabilities:
  - id: CVE-2025-15558
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/docker/cli@v28.5.1%2Bincompatible
    expired_at: 2026-12-25
    statement: >-
      This affects only Windows CLI plugin paths; the published app image runs
      on Linux. The exception nevertheless remains temporary pending review.
  - id: CVE-2026-17106
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/moby/go-archive@v0.1.0
    expired_at: 2026-12-25
    statement: >-
      Temporarily accepted upstream finding in the unmodified Portainer binary;
      only trusted images and archives are allowed until a fix is available.
  - id: CVE-2026-33747
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/moby/buildkit@v0.25.1
    expired_at: 2026-12-25
    statement: >-
      Temporarily accepted upstream finding; untrusted BuildKit frontends are
      not used until a fix is available.
  - id: CVE-2026-33748
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/moby/buildkit@v0.25.1
    expired_at: 2026-12-25
    statement: >-
      Temporarily accepted upstream finding; untrusted Git build contexts are
      not used until a fix is available.
  - id: CVE-2026-41567
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/docker/docker@v28.5.2%2Bincompatible
    expired_at: 2026-12-25
    statement: >-
      Temporarily accepted Moby archive finding; only trusted container images
      and archives are allowed until a fix is available.
  - id: CVE-2026-42306
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/docker/docker@v28.5.2%2Bincompatible
    expired_at: 2026-12-25
    statement: >-
      Temporarily accepted Moby docker-cp finding; only trusted containers and
      files are managed until a fix is available.
  - id: CVE-2026-78661
    paths:
      - portainer
    purls:
      - pkg:golang/golang.org/x/net@v0.60.0
    expired_at: 2026-12-25
    statement: >-
      Temporary private administrator-only operation; the x/net HTML parsing
      denial of service remains in the upstream Go binary until a fix ships.
      Requires explicit owner acceptance.
  - id: CVE-2026-95837
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/containerd/containerd/v2@v2.2.5
    expired_at: 2026-12-25
    statement: >-
      Affects CRI checkpoint restore in the containerd daemon. The app image runs
      no containerd daemon; the Portainer binary only embeds client libraries.
  - id: CVE-2026-95839
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/containerd/containerd/v2@v2.2.5
    expired_at: 2026-12-25
    statement: >-
      Affects the containerd daemon transfer service. The app image runs no
      containerd daemon, and only trusted images are pulled.
misconfigurations:
  - id: AVD-DS-0002
    paths:
      - portaineree/Dockerfile
    statement: >-
      Portainer requires root access to the Docker socket provided by the
      Supervisor to manage the local Docker environment.
