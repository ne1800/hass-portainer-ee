vulnerabilities:
  - id: CVE-2025-15558
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/docker/cli@v28.5.1%2Bincompatible
    expired_at: 2026-11-14
    statement: >-
      This affects only Windows CLI plugin paths; the published app image runs
      on Linux. The exception nevertheless remains temporary pending review.
  - id: CVE-2026-17106
    paths:
      - portainer
    purls:
      - pkg:golang/github.com/moby/go-archive@v0.1.0
    expired_at: 2026-11-14
    statement: >-
      Temporarily accepted upstream finding in the unmodified Portainer binary;
      only trusted images and archives are allowed until a fix is available.
